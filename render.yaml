databases:
  - name: taskflow-db
    databaseName: taskflow
    user: taskflow_user
    plan: free
    region: oregon

services:
  # Python / Django REST Framework Web Service
  - type: web
    name: taskflow-django-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: gunicorn taskmanager.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
